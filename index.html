<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather & News App</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>5 Day Forecast</h1>
  <h2>Summary</h2>

  <nav>
    <ul>
      <li>Home</li>
      <li>News</li>
      <li>Weather</li>
      <li style="float:right">About</li>
    </ul>
  </nav>

  <main>
    <hr>

    <!-- CURRENT WEATHER -->
    <section id="stats">
      <div class="summary">

        <h2>Weather Summary</h2>
        <h3 id="five-city"></h3>

        <img
          class="main-weather-img"
          src="https://github.com/AndrewP-Instructor/HTMLProject1/blob/main/images/Umbrella.jpg?raw=true"
          alt="Weather image"
        >

        <div class="weather-row">
          <img src="https://img.icons8.com/ios-filled/50/cloud.png" alt="cloud">
          <p>Currently: <span id="current-desc"></span></p>
        </div>

        <div class="weather-row">
          <img src="https://github.com/AndrewP-Instructor/HTMLProject1/blob/main/images/Sunny.jpg?raw=true" alt="sun">
          <p>Temperature: <span id="current-temp"></span> °F</p>
        </div>

        <div class="weather-row">
          <img src="https://github.com/AndrewP-Instructor/HTMLProject1/blob/main/images/Windy.jpg?raw=true" alt="wind">
          <p>Feels Like: <span id="current-feelsLike"></span> °F</p>
        </div>

        <div class="weather-row">
          <img src="https://github.com/AndrewP-Instructor/HTMLProject1/blob/main/images/overcast.jpg?raw=true" alt="clouds">
          <p>Wind Chill: <span id="current-windChill"></span> °F</p>
        </div>

        <div class="weather-row">
          <img src="https://github.com/AndrewP-Instructor/HTMLProject1/blob/main/images/thunderStorms.jpg?raw=true" alt="storm">
          <p>Humidity: <span id="current-humid"></span>%</p>
        </div>

        <div class="weather-row">
          <img src="https://github.com/AndrewP-Instructor/HTMLProject1/blob/main/images/snowy.jpg?raw=true" alt="snow">
          <p>Wind Speed: <span id="current-windSpeed"></span> mph</p>
        </div>

      </div>
    </section>

    <hr>

    <!-- NEWS SECTION -->
    <section id="news">
      <h2>Top Business News</h2>
      <div id="news-container"></div>
    </section>

    <hr>
  </main>

  <footer>
    <p>
      &copy; 2025 | Amanda Reeder | Tooele Technical College<br>
      Last Updated: February 2, 2026
    </p>
  </footer>

  <script src="weather-header.js"></script>
</body>
</html>
